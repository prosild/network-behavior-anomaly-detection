# conda 환경 정의. conda는 Python·Java만 맡고, 나머지는 pip가 맡는다.
# 다시 만들기:
#   conda env create -f environment.yml
#   conda activate zeek-ad
#   WSL에서 GPU를 쓰면 env/conda/의 활성화 스크립트를 $CONDA_PREFIX/etc/conda/에 복사한다.
name: zeek-ad
channels:
  - conda-forge
dependencies:
  - python=3.13.18
  - openjdk=21.0.10
  - pip=26.2.2
  - pip:
      - -r requirements.lock.txt
variables:
  SPARK_LOCAL_IP: 127.0.0.1
